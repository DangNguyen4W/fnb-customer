pre-commit:
  parallel: true
  jobs:
    - name: lint checking
      run: npm run lint:fix -- {staged_files}
      glob: "*.{js,ts,jsx,tsx}"
      stage_fixed: true

commit-msg:
  jobs:
    - name: commit message checking
      run: npx commitlint --edit {1}

pre-push:
  jobs:
    - name: test
      run: npm run test
